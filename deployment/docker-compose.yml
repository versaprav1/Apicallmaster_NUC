version: '3.8'

services:
  whint-ai-assistant:
    build: .
    ports:
      - "8501:8501"
    environment:
      - WHINT_API_BASE_URL=${WHINT_API_BASE_URL}
      - WHINT_API_X_API_KEY=${WHINT_API_X_API_KEY}
      - WHINT_USERNAME=${WHINT_USERNAME}
      - WHINT_PASSWORD=${WHINT_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s